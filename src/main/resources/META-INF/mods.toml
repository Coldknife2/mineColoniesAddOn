modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Coldknife2/mineColoniesAddOn/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
MineColonies add-on: the Minergy, an energy generated by the Mystical Mage at the Library.
Builders can spend it to place the blocks they are missing. Blocks placed with Minergy drop nothing.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    mandatory=true
    versionRange="${minecolonies_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="structurize"
    mandatory=true
    versionRange="[1.20.1-1.0.800,)"
    ordering="AFTER"
    side="BOTH"
