modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Coldknife2/mineColoniesAddOn/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
MineColonies add-on: the Minergy, an energy generated by the Mystical Mage at the Mystical Site.
Builders can spend it to place the blocks they are missing. Blocks placed with Minergy drop nothing.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    versionRange="${minecolonies_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="structurize"
    type="required"
    versionRange="[1.0.800-1.21.1-snapshot,)"
    ordering="AFTER"
    side="BOTH"
