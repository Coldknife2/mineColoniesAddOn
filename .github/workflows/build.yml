name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Read mod version
        id: version
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload the jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: minergy-${{ steps.version.outputs.mod_version }}-build${{ github.run_number }}
          path: build/libs/*.jar

      # On main only: publish a GitHub Release with the jar, downloadable from the "Releases" page.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.mod_version }}-build${{ github.run_number }}
          name: Minergy ${{ steps.version.outputs.mod_version }} (build ${{ github.run_number }})
          body: |
            Build automatique de `main` (commit ${{ github.sha }}).

            Installation : déposer `minergy-${{ steps.version.outputs.mod_version }}.jar` dans le dossier `mods/` de Minecraft 1.20.1 (Forge 47+),
            avec MineColonies 1.20.1 et ses dépendances (Structurize, BlockUI, Domum Ornamentum, Multi-Piston).
          files: build/libs/*.jar
          make_latest: true
